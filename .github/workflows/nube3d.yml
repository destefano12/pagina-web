name: Nube de escaneo 3D

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 12 * * *'  # 9 de la mañana en Argentina: arranca la nube del día
  workflow_dispatch:

concurrency:
  group: nube3d
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  escanear:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      MVS_DIR: ${{ github.workspace }}/herramientas/openmvs
      WORKER_NOMBRE: github-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay platos esperando?
        id: cola
        run: python3 nube3d/nube_github.py hay

      - name: Instalar COLMAP y librerías
        if: steps.cola.outputs.hay == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends colmap \
            libopencv-calib3d406t64 libopencv-features2d406t64 libopencv-imgcodecs406t64 libopencv-imgproc406t64 \
            libboost-iostreams1.83.0 libboost-program-options1.83.0 libboost-serialization1.83.0 \
            libgomp1 libglx0 libgmp10 > /dev/null
          chmod +x herramientas/openmvs/*
          if ldd herramientas/openmvs/DensifyPointCloud | grep "not found"; then exit 1; fi
          # misma versión de librerías que el motor en Docker (motor3d/docker/bloqueo-worker.txt)
          pip install -q --break-system-packages -r nube3d/requirements.txt -c motor3d/docker/bloqueo-worker.txt
          # gltfpack (meshoptimizer, MIT): reduce la malla respetando la textura y comprime la versión para celular
          curl -fsSL -o /tmp/gltfpack.zip https://github.com/zeux/meshoptimizer/releases/download/v0.24/gltfpack-ubuntu.zip
          sudo unzip -o -q /tmp/gltfpack.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/gltfpack
          gltfpack -v 2>&1 | head -1 || true

      - name: Armar los modelos 3D
        if: steps.cola.outputs.hay == 'si'
        env:
          QT_QPA_PLATFORM: offscreen
          DENSA_MAX: '1600'
          TEXTURA_MAX: '4096'
          LIMITE_PASO_S: '10800'
          GH_TOKEN: ${{ github.token }}
        run: python3 nube3d/nube_github.py
